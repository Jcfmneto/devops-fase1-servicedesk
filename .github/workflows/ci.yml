name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Testes (pytest ${{ matrix.python }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Executa testes com cobertura (mínimo 80%)
        run: pytest --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=80 --junitxml=junit.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-reports-${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  build:
    name: Build da imagem Docker + smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t servicedesk-api:${{ github.sha }} .
      - name: Smoke test (/health)
        run: |
          docker run -d --name api -p 8000:8000 servicedesk-api:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
